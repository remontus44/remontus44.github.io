<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расчёт стоимости — Ремонтус44</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15803d">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Расчёт">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="head">
  <div class="head__row">
    <span class="head__brand">Ремонтус44</span>
    <span class="head__title">калькулятор</span>
  </div>

  <div class="search">
    <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="q" type="search" placeholder="ГРМ, эндоскоп, фреон…" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Поиск услуги">
    <button class="search__clear" id="clearQ" type="button" hidden aria-label="Очистить">×</button>
  </div>

  <nav class="chips" id="chips" aria-label="Категории"></nav>
</header>

<main class="list" id="list"></main>

<div class="empty" id="empty" hidden>
  <p>Ничего не нашлось.</p>
  <p class="empty__hint">Попробуйте «ГРМ», «эндоскоп», «фреон», «масло».</p>
</div>

<div class="bar" id="bar" hidden>
  <button class="bar__main" id="openSheet" type="button">
    <span class="bar__sum" id="barSum">0 ₽</span>
    <span class="bar__meta" id="barMeta">0 позиций</span>
  </button>
  <button class="iconbtn" id="quickCopy" type="button" aria-label="Скопировать смету">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
  </button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__handle" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 id="sheetTitle">Смета</h2>
      <button class="sheet__close" type="button" data-close aria-label="Закрыть">×</button>
    </div>

    <div class="sheet__body" id="sheetBody"></div>

    <div class="sheet__foot">
      <label class="toggle">
        <input type="checkbox" id="noteTgl" checked>
        <span>Дописать «точную сумму скажу после осмотра»</span>
      </label>
      <div class="sheet__totals">
        <div class="totals__row">
          <span class="totals__label">Итого</span>
          <span class="totals__sum" id="sheetSum">0 ₽</span>
        </div>
        <div class="totals__time" id="sheetTime">—</div>
      </div>
      <div class="sheet__actions">
        <button class="btn btn--primary" id="copyBtn" type="button">Копировать</button>
        <button class="btn btn--ghost" id="shareBtn" type="button">Поделиться</button>
        <button class="btn btn--plain" id="clearBtn" type="button">Очистить</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
